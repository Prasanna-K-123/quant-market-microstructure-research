# Standalone repository validation workflow.
name: Quant Microstructure Research Validation

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'run_research.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/validation.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Unit tests
        run: python -m pytest

      - name: Run frozen reference research
        run: |
          python run_research.py \
            --symbols BTCUSDT ETHUSDT \
            --start 2025-01-02 \
            --end 2025-01-15 \
            --cache-dir data/raw \
            --output-dir results \
            --report-dir reports/generated

      - name: Evidence inventory
        if: always()
        run: |
          echo '--- results ---'
          find results -maxdepth 2 -type f -print 2>/dev/null || true
          echo '--- generated report ---'
          find reports/generated -maxdepth 3 -type f -print 2>/dev/null || true

      - name: Upload validated evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: quant-microstructure-research-evidence
          path: |
            results/**
            reports/generated/**
          retention-days: 30
